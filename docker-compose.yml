# Dev:   docker compose up -d db        (then `npm run dev` on the host)
# Full:  docker compose up --build      (app at http://localhost:8080)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leave
      POSTGRES_PASSWORD: leave
      POSTGRES_DB: leave
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leave -d leave"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://leave:leave@db:5432/leave
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PORT: "4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:


